<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Institutional Theater of the Hague</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,700;1,900&family=Source+Serif+Pro:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════
     The Institutional Theater of the Hague — self-contained block.
     Everything is scoped under .itth-root so it can be dropped
     straight into a page without touching <html>/<body> styles.
     ═══════════════════════════════════════════════════════════ -->
<div class="itth-root">

  <style>
    .itth-root {
      --bg: #ffffff;
      --ink: #161616;
      --muted: #6b6b6b;
      --rule: #e2e2e2;

      --c-workshop1: #ff5fa2; /* gob kee experimental nasi */
      --c-workshop2: #e2552b; /* volcano news network: magma */
      --c-workshop3: #3ca64b; /* experience worker: guide to haag greenry */
      --c-workshop4: #2f6fed; /* volcano news network: first week broadcast */
      --c-whoweare:  #f3b400; /* who we are */

      box-sizing: border-box;
      width: 100%;
      display: grid;
      grid-template-columns: 6rem 1fr 60%;
      align-items: start;
      font-family: 'Source Serif Pro', Georgia, serif;
      background: var(--bg);
      color: var(--ink);
    }

    .itth-root * {
      box-sizing: border-box;
    }

    /* ─── VERTICAL HEADER ─── */
    .itth-header {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 0.5rem;
    }
    .itth-header h1 {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: 2.2rem;
      line-height: 1.05;
      letter-spacing: 0.01em;
      white-space: normal;
      margin: 0 auto;
    }

    /* ─── LEFT COLUMN ─── */
    .itth-left {
      padding: 3rem 4%;
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
      min-width: 0;
    }

    .itth-season-title,
    .itth-section-title {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: 2rem;
      letter-spacing: -0.01em;
      margin: 0 0 1rem;
    }

    .itth-workshop-list {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .itth-workshop {
      cursor: pointer;
      transition: color 0.25s ease;
      max-width: 32ch;
    }

    .itth-workshop .itth-label {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 800;
      font-size: 1.2rem;
      display: block;
      margin-bottom: 0.1rem;
    }

    .itth-workshop .itth-sub {
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--muted);
      line-height: 1.35;
      transition: color 0.25s ease;
      display: block;
    }

    .itth-workshop:hover .itth-sub,
    .itth-workshop.active .itth-sub { color: inherit; }
    .itth-workshop:hover,
    .itth-workshop.active { color: var(--accent); }

    .itth-workshop[data-key="w1"] { --accent: var(--c-workshop1); }
    .itth-workshop[data-key="w2"] { --accent: var(--c-workshop2); }
    .itth-workshop[data-key="w3"] { --accent: var(--c-workshop3); }
    .itth-workshop[data-key="w4"] { --accent: var(--c-workshop4); }
    .itth-workshop[data-key="who"] { --accent: var(--c-whoweare); }

    .itth-section .itth-label {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 800;
      font-size: 1.1rem;
      line-height: 1.4;
      display: block;
    }

    /* ─── RIGHT COLUMN ─── */
    .itth-right {
      position: sticky;
      top: 0;
      height: 100vh;
      min-height: 480px;
      max-height: 800px;
      overflow: hidden;
      background: #ededed;
    }

    .itth-image {
      position: absolute;
      inset: 0;
      background-color: #ededed;
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      transition: background-image 0.35s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .itth-image::before {
      content: "Image placeholder — add link here";
      font-family: 'Source Serif Pro', serif;
      font-style: italic;
      color: #a8a8a8;
      font-size: 1rem;
      text-align: center;
      padding: 0 2rem;
    }

    .itth-image.has-image::before {
      content: "";
    }

    /* overlay info card */
    .itth-overlay {
      position: absolute;
      width: 42%;
      min-height: 45%;
      padding: 2rem;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease, background-color 0.25s ease;
      background-color: var(--overlay-color, #ffffff);
      overflow: auto;

      /* default position — overridden by .itth-overlay--* placement classes */
      bottom: 6%;
      left: 6%;
    }

    .itth-overlay.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* ─── overlay placement variants ─── */
    .itth-overlay--top-left     { top: 6%;    left: 6%;   bottom: auto; right: auto; }
    .itth-overlay--top-right    { top: 6%;    right: 6%;  bottom: auto; left: auto;  }
    .itth-overlay--bottom-left  { bottom: 6%; left: 6%;   top: auto;    right: auto; }
    .itth-overlay--bottom-right { bottom: 6%; right: 6%;  top: auto;    left: auto;  }

    .itth-overlay-title {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-style: italic;
      font-size: 2rem;
      margin: 0 0 0.4rem;
      line-height: 1.2;
    }

    .itth-overlay-subtitle {
      font-family: 'Source Serif Pro', serif;
      font-weight: 700;
      font-size: 1.3rem;
      margin: 0 0 1rem;
      line-height: 1.4;
    }

    .itth-overlay-text {
      font-size: 1.1rem;
      line-height: 1.6;
      margin: 0 0 1rem;
    }

    .itth-overlay-link {
      display: inline-block;
      font-family: 'Source Serif Pro', serif;
      font-weight: 700;
      font-size: 1rem;
      color: var(--ink);
      text-decoration: underline;
    }

    .itth-overlay-link[hidden] { display: none; }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 700px) {
      .itth-root {
        grid-template-columns: 1fr;
      }
      .itth-header {
        padding: 1.5rem;
      }
      .itth-header h1 {
        writing-mode: horizontal-tb;
        transform: none;
        font-size: 1.8rem;
      }
      .itth-left {
        padding: 2.5rem 6%;
      }
      .itth-right {
        position: relative;
        top: auto;
        height: 70vh;
        max-height: none;
      }
    }
  </style>

  <!-- ═══ VERTICAL HEADER ═══ -->
  <header class="itth-header">
    <h1>The Institutional Theater of the Hague</h1>
  </header>

  <!-- ═══ LEFT COLUMN ═══ -->
  <main class="itth-left">

    <section class="itth-season">
      <h2 class="itth-season-title">Season Zero</h2>
      <div class="itth-workshop-list">

        <div class="itth-workshop" data-key="w1">
          <span class="itth-label">gob kee experimental</span>
          <span class="itth-sub">nasi workshop</span>
        </div>

        <div class="itth-workshop" data-key="w2">
          <span class="itth-label">volcano news network:</span>
          <span class="itth-sub">magma workshop</span>
        </div>

        <div class="itth-workshop" data-key="w3">
          <span class="itth-label">experience worker</span>
          <span class="itth-sub">guide to haag greenry</span>
        </div>

      </div>
    </section>

    <section class="itth-season">
      <h2 class="itth-season-title">Season One</h2>
      <div class="itth-workshop-list">

        <div class="itth-workshop" data-key="w4">
          <span class="itth-label">volcano news network:</span>
          <span class="itth-sub">the first week broadcast</span>
        </div>

      </div>
    </section>

    <section class="itth-section">
      <h2 class="itth-section-title">Who We Are</h2>
      <div class="itth-workshop-list">

        <div class="itth-workshop" data-key="who">
          <span class="itth-label">The Mission of ITTH,</span>
          <span class="itth-sub">BJSQJZ, A HamWorld</span>
        </div>

      </div>
    </section>

  </main>

  <!-- ═══ RIGHT COLUMN ═══ -->
  <aside class="itth-right">
    <div class="itth-image" id="itthImage"></div>
    <div class="itth-overlay" id="itthOverlay">
      <h3 class="itth-overlay-title" id="itthOverlayTitle"></h3>
      <p class="itth-overlay-subtitle" id="itthOverlaySubtitle"></p>
      <p class="itth-overlay-text" id="itthOverlayText"></p>
      <a class="itth-overlay-link" id="itthOverlayLink" href="#" target="_blank" rel="noopener">Learn more →</a>
    </div>
  </aside>

</div><!-- /itth-root -->

<script>
(function () {

  // ═══════════════════════════════════════════════════════════════════
  // CARD CONTENT — everything shown on the floating card over the image.
  // Edit the text/links/position below for each workshop. Keys match
  // each workshop's data-key attribute in the HTML above.
  //
  //   title      — bold italic heading on the card
  //   subtitle   — smaller line under the title
  //   desc       — paragraph body text
  //   link       — URL for the "Learn more" link (leave "" to hide it)
  //   linkText   — label for the link
  //   position   — where the card sits over the image:
  //                 "top-left" | "top-right" | "bottom-left" | "bottom-right"
  // ═══════════════════════════════════════════════════════════════════
  const CONTENT = {
    w1: {
      title:    "Gob Kee Experimental Nasi Workshop",
      subtitle: "Season Zero Workshop",
      desc:     "Placeholder description — a hands-on culinary and performance workshop exploring fictive cuisine, ritual, and shared imagination through the lens of gob kee.",
      link:     "",
      linkText: "Learn more →",
      position: "bottom-left",
    },
    w2: {
      title:    "Volcano News Network: Magma Workshop",
      subtitle: "Season Zero Workshop",
      desc:     "Placeholder description — participants build out a fictional news network reporting live from the volcano, blending broadcast performance with collective worldbuilding.",
      link:     "",
      linkText: "Learn more →",
      position: "top-right",
    },
    w3: {
      title:    "Experience Worker",
      subtitle: "Guide to Hague Greenery — Weekend Workshop",
      desc:     "Rapidly prototype and create a digital guide to the best walks, rides, swims, forests, DJ gardens in the Haagosphere.",
      link:     "",
      linkText: "Learn more →",
      position: "bottom-right",
    },
    w4: {
      title:    "Volcano News Network",
      subtitle: "The First Week Broadcast — Season One",
      desc:     "Placeholder description — the volcano news network returns for a full week of live broadcasts, expanding the fictional institution into an ongoing performance series.",
      link:     "",
      linkText: "Learn more →",
      position: "top-left",
    },
    who: {
      title:    "Who We Are",
      subtitle: "The Mission of ITTH, BJSQJZ, A HamWorld",
      desc:     "Placeholder description — an overview of the mission behind The Institutional Theater of the Hague, its founding collectives, and the wider HamWorld it belongs to.",
      link:     "",
      linkText: "Learn more →",
      position: "bottom-left",
    },
  };
  // ═══════════════════════════════════════════════════════════════════

  // ═══════════════════════════════════════════════════════════
  // IMAGE LINKS — paste full URLs from your image host below.
  // Each key matches a workshop's data-key attribute in the HTML.
  // Leave a value as "" to fall back to the default image.
  // ═══════════════════════════════════════════════════════════
  const IMAGES = {
    default: "https://i.imgur.com/mG56JeG.jpeg",   // shown before any selection
    w1:      "https://i.imgur.com/ZYN9LEd.jpeg",   // gob kee experimental nasi workshop
    w2:      "https://i.imgur.com/1V1kgkx.jpeg",   // volcano news network: magma workshop
    w3:      "https://i.imgur.com/J4fRJn6.jpeg",   // experience worker: guide to haag greenry
    w4:      "https://i.imgur.com/lPLeShN.jpeg",   // volcano news network: the first week broadcast
    who:     "https://i.imgur.com/cWf4Awl.jpeg",   // who we are
  };
  // ═══════════════════════════════════════════════════════════

  const root = document.querySelector('.itth-root');
  const image = root.querySelector('#itthImage');
  const overlay = root.querySelector('#itthOverlay');
  const overlayTitle = root.querySelector('#itthOverlayTitle');
  const overlaySubtitle = root.querySelector('#itthOverlaySubtitle');
  const overlayText = root.querySelector('#itthOverlayText');
  const overlayLink = root.querySelector('#itthOverlayLink');

  const PLACEMENTS = ['top-left', 'top-right', 'bottom-left', 'bottom-right'];

  function setImage(src) {
    if (src) {
      image.style.backgroundImage = `url('${src}')`;
      image.classList.add('has-image');
    } else {
      image.style.backgroundImage = 'none';
      image.classList.remove('has-image');
    }
  }

  function showCard(item) {
    const key = item.dataset.key;
    const content = CONTENT[key] || {};
    const accent = getComputedStyle(item).getPropertyValue('--accent').trim();

    setImage(IMAGES[key] || IMAGES.default);

    overlay.style.setProperty('--overlay-color', accent);
    overlayTitle.textContent = content.title || '';
    overlaySubtitle.textContent = content.subtitle || '';
    overlayText.textContent = content.desc || '';

    if (content.link) {
      overlayLink.href = content.link;
      overlayLink.textContent = content.linkText || 'Learn more →';
      overlayLink.hidden = false;
    } else {
      overlayLink.hidden = true;
    }

    PLACEMENTS.forEach(p => overlay.classList.remove('itth-overlay--' + p));
    overlay.classList.add('itth-overlay--' + (content.position || 'bottom-left'));

    overlay.classList.add('visible');
  }

  function hideCard() {
    setImage(IMAGES.default);
    overlay.classList.remove('visible');
  }

  const workshops = root.querySelectorAll('.itth-workshop');

  setImage(IMAGES.default);

  workshops.forEach(item => {
    item.addEventListener('click', () => {
      const isActive = item.classList.contains('active');

      workshops.forEach(w => w.classList.remove('active'));

      if (isActive) {
        hideCard();
      } else {
        item.classList.add('active');
        showCard(item);
      }
    });
  });
})();
</script>

</body>
</html>
