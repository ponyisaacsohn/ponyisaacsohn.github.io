<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Institutional Theater of the Hague</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,700;1,900&family=Source+Serif+Pro:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafafa;
      --ink: #161616;
      --muted: #6b6b6b;
      --rule: #e2e2e2;

      --c-workshop1: #ff5fa2; /* gob kee experimental nasi */
      --c-workshop2: #e2552b; /* volcano news network: magma */
      --c-workshop3: #3ca64b; /* experience worker: guide to haag greenry */
      --c-workshop4: #2f6fed; /* volcano news network: first week broadcast */
      --c-whoweare:  #f3b400; /* who we are */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: 'Source Serif Pro', Georgia, serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
    }

    /* ─── VERTICAL HEADER ─── */
    .vertical-header {
      flex-shrink: 0;
      width: 6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 0.5rem;
      border-right: 1px solid var(--rule);
    }
    .vertical-header h1 {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: 2.6rem;
      line-height: 1.05;
      letter-spacing: 0.01em;
      white-space: normal;
      margin: 0 auto;
    }

    /* ─── PAGE LAYOUT ─── */
    .page {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      min-width: 0;
    }

    /* ─── LEFT COLUMN ─── */
    .left-column {
      flex: 1 1 60%;
      min-width: 360px;
      padding: 4rem 4%;
      display: flex;
      flex-direction: column;
      gap: 3.25rem;
    }

    .season-title,
    .section-title {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: 3rem;
      letter-spacing: -0.01em;
      margin-bottom: 1.6rem;
    }

    .workshop-list {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .workshop {
      cursor: default;
      transition: color 0.25s ease;
      max-width: 32ch;
    }

    .workshop .label {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 800;
      font-size: 1.85rem;
      display: block;
      margin-bottom: 0.2rem;
    }

    .workshop .sub {
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      font-size: 1.7rem;
      color: var(--muted);
      line-height: 1.35;
      transition: color 0.25s ease;
    }

    .workshop:hover .sub { color: inherit; }
    .workshop:hover { color: var(--accent); }

    .workshop[data-key="w1"] { --accent: var(--c-workshop1); }
    .workshop[data-key="w2"] { --accent: var(--c-workshop2); }
    .workshop[data-key="w3"] { --accent: var(--c-workshop3); }
    .workshop[data-key="w4"] { --accent: var(--c-workshop4); }
    .workshop[data-key="who"] { --accent: var(--c-whoweare); }

    .season + .season,
    .season + .section,
    .section + .section {
      padding-top: 0.5rem;
      border-top: 1px solid var(--rule);
    }

    .section .label {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 800;
      font-size: 1.7rem;
      line-height: 1.4;
    }

    /* ─── RIGHT COLUMN ─── */
    .right-column {
      flex: 1 1 40%;
      min-width: 280px;
      min-height: 420px;
      position: relative;
      overflow: hidden;
      background: #ededed;
    }

    .image-display {
      position: absolute;
      inset: 0;
      background-color: #ededed;
      background-image: var(--default-img, none);
      background-size: cover;
      background-position: center;
      transition: background-image 0.35s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-display::before {
      content: "Image placeholder — add link here";
      font-family: 'Source Serif Pro', serif;
      font-style: italic;
      color: #a8a8a8;
      font-size: 1rem;
      text-align: center;
      padding: 0 2rem;
    }

    .image-display.has-image::before {
      content: "";
    }

    /* overlay info box */
    .overlay {
      position: absolute;
      top: 6%;
      left: 6%;
      right: 12%;
      max-width: 80%;
      padding: 2rem;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease, background-color 0.25s ease;
      background-color: var(--overlay-color, #ffffff);
    }

    .overlay.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .overlay-title {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-style: italic;
      font-size: 2rem;
      margin-bottom: 0.4rem;
      line-height: 1.2;
    }

    .overlay-subtitle {
      font-family: 'Source Serif Pro', serif;
      font-weight: 700;
      font-size: 1.3rem;
      margin-bottom: 1rem;
      line-height: 1.4;
    }

    .overlay-text {
      font-size: 1.1rem;
      line-height: 1.6;
    }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 700px) {
      body { flex-direction: column; }
      .vertical-header {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--rule);
        padding: 1.5rem;
      }
      .vertical-header h1 {
        writing-mode: horizontal-tb;
        transform: none;
        font-size: 1.8rem;
      }
      .left-column {
        min-width: 0;
        padding: 2.5rem 6%;
      }
    }
  </style>
</head>
<body>

  <!-- ═══ VERTICAL HEADER ═══ -->
  <header class="vertical-header">
    <h1>The Institutional Theater of the Hague</h1>
  </header>

  <div class="page">

    <!-- ═══ LEFT COLUMN ═══ -->
    <div class="left-column">

      <section class="season">
        <h2 class="season-title">Season Zero</h2>
        <div class="workshop-list">

          <div class="workshop" data-key="w1"
               data-title="Gob Kee Experimental Nasi Workshop"
               data-subtitle="Season Zero Workshop"
               data-desc="Placeholder description — a hands-on culinary and performance workshop exploring fictive cuisine, ritual, and shared imagination through the lens of gob kee."
               data-img="">
            <span class="label">gob kee experimental</span>
            <span class="sub">nasi workshop</span>
          </div>

          <div class="workshop" data-key="w2"
               data-title="Volcano News Network: Magma Workshop"
               data-subtitle="Season Zero Workshop"
               data-desc="Placeholder description — participants build out a fictional news network reporting live from the volcano, blending broadcast performance with collective worldbuilding."
               data-img="">
            <span class="label">volcano news network:</span>
            <span class="sub">magma workshop</span>
          </div>

          <div class="workshop" data-key="w3"
               data-title="Experience Worker"
               data-subtitle="Guide to Hague Greenery — Weekend Workshop"
               data-desc="Rapidly prototype and create a digital guide to the best walks, rides, swims, forests, DJ gardens in the Haagosphere."
               data-img="">
            <span class="label">experience worker</span>
            <span class="sub">guide to haag greenry</span>
          </div>

        </div>
      </section>

      <section class="season">
        <h2 class="season-title">Season One</h2>
        <div class="workshop-list">

          <div class="workshop" data-key="w4"
               data-title="Volcano News Network"
               data-subtitle="The First Week Broadcast — Season One"
               data-desc="Placeholder description — the volcano news network returns for a full week of live broadcasts, expanding the fictional institution into an ongoing performance series."
               data-img="">
            <span class="label">volcano news network:</span>
            <span class="sub">the first week broadcast</span>
          </div>

        </div>
      </section>

      <section class="section">
        <h2 class="section-title">Who We Are</h2>
        <div class="workshop-list">

          <div class="workshop" data-key="who"
               data-title="Who We Are"
               data-subtitle="The Mission of ITTH, BJSQJZ, A HamWorld"
               data-desc="Placeholder description — an overview of the mission behind The Institutional Theater of the Hague, its founding collectives, and the wider HamWorld it belongs to."
               data-img="">
            <span class="label">The Mission of ITTH,</span>
            <span class="sub">BJSQJZ, A HamWorld</span>
          </div>

        </div>
      </section>

    </div><!-- /left-column -->

    <!-- ═══ RIGHT COLUMN ═══ -->
    <div class="right-column">
      <div class="image-display" id="imageDisplay"></div>
      <div class="overlay" id="overlay">
        <div class="overlay-title" id="overlayTitle"></div>
        <div class="overlay-subtitle" id="overlaySubtitle"></div>
        <div class="overlay-text" id="overlayText"></div>
      </div>
    </div>

  </div><!-- /page -->

  <script>
    const imageDisplay = document.getElementById('imageDisplay');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySubtitle = document.getElementById('overlaySubtitle');
    const overlayText = document.getElementById('overlayText');

    const workshops = document.querySelectorAll('.workshop');

    workshops.forEach(item => {
      item.addEventListener('mouseenter', () => {
        const img = item.dataset.img;
        const accent = getComputedStyle(item).getPropertyValue('--accent').trim();

        if (img) {
          imageDisplay.style.backgroundImage = `url('${img}')`;
          imageDisplay.classList.add('has-image');
        } else {
          imageDisplay.style.backgroundImage = 'none';
          imageDisplay.classList.remove('has-image');
        }

        overlay.style.setProperty('--overlay-color', accent);
        overlayTitle.textContent = item.dataset.title || '';
        overlaySubtitle.textContent = item.dataset.subtitle || '';
        overlayText.textContent = item.dataset.desc || '';
        overlay.classList.add('visible');
      });

      item.addEventListener('mouseleave', () => {
        imageDisplay.style.backgroundImage = 'none';
        imageDisplay.classList.remove('has-image');
        overlay.classList.remove('visible');
      });
    });
  </script>

</body>
</html>
