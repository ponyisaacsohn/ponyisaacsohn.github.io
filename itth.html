<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ITTH — The Institutional Theater of the Hague</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
    }

    body {
      background: linear-gradient(to bottom, #e2f200 0%, #2d5a00 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 8vw;
    }

    .text-container {
      width: 100%;
      max-width: 1200px;
      text-align: center;
    }

    .line {
      font-family: 'Bodoni 72 SmallCaps', 'Bodoni 72', 'Bodoni Moda', 'Playfair Display SC', Georgia, serif;
      font-variant: small-caps;
      font-size: clamp(1.8rem, 3.8vw, 3.6rem);
      line-height: 1.6;
      letter-spacing: 0.04em;
      display: block;
    }

    .line.green  { color: #2d5a00; }
    .line.yellow { color: #e2f200; }

    @keyframes blink {
      50% { border-right-color: transparent; }
    }

    .line.typing {
      border-right: 3px solid currentColor;
      animation: blink 0.7s step-end infinite;
    }
  </style>
</head>
<body>
  <div class="text-container">
    <span class="line green"  id="l1"></span>
    <span class="line green"  id="l2"></span>
    <span class="line green"  id="l3"></span>
    <span class="line green"  id="l4"></span>
    <span class="line green"  id="l5"></span>
    <span class="line yellow" id="l6"></span>
    <span class="line yellow" id="l7"></span>
    <span class="line yellow" id="l8"></span>
    <span class="line yellow" id="l9"></span>
    <span class="line yellow" id="l10"></span>
  </div>

  <script>
    const texts = [
      "The Institutional Theater of the Hague",
      "(ITTH) offers discerning audiences",
      "performances of nonexistent, hypothetical,",
      "desired, dystopian, promising, explosive,",
      "esoteric, and ecstatic institutions.",
      "This is Season Zero of the ITTH, our goals are to",
      "form the Ensemble and find partners and",
      "funders for season one.  Season Zero has two",
      "arms: a series of paid workshops to share the",
      "magic powers of institutional performance",
    ];

    const SPEED = 55; // ms per character
    const START_DELAY = 600;

    function typeInto(el, text) {
      let i = 0;
      el.textContent = '';
      el.classList.add('typing');
      function tick() {
        if (i < text.length) {
          el.textContent += text[i++];
          setTimeout(tick, SPEED);
        } else {
          el.classList.remove('typing');
          el.style.borderRight = 'none';
        }
      }
      tick();
    }

    setTimeout(() => {
      texts.forEach((text, idx) => {
        typeInto(document.getElementById('l' + (idx + 1)), text);
      });
    }, START_DELAY);
  </script>
</body>
</html>
