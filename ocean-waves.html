<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ocean Waves</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="waves"></canvas>
<script>
const canvas = document.getElementById('waves');
const ctx = canvas.getContext('2d');

let width, height;
function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Lines configuration: each line is a horizontal band of waves
const LINE_COUNT = 24;
const lines = [];
for (let i = 0; i < LINE_COUNT; i++) {
  lines.push({
    baseY: (i / LINE_COUNT) * height,
    amplitude: 4 + Math.random() * 18,
    wavelength: 80 + Math.random() * 200,
    speed: 0.2 + Math.random() * 0.6,
    phase: Math.random() * Math.PI * 2,
    opacity: 0.15 + Math.random() * 0.6
  });
}

// Floating dots scattered across the scene
const DOT_COUNT = 150;
const dots = [];
for (let i = 0; i < DOT_COUNT; i++) {
  dots.push({
    x: Math.random() * width,
    y: Math.random() * height,
    radius: 0.5 + Math.random() * 2,
    amplitude: 2 + Math.random() * 6,
    wavelength: 60 + Math.random() * 150,
    speed: 0.2 + Math.random() * 0.8,
    phase: Math.random() * Math.PI * 2,
    opacity: 0.2 + Math.random() * 0.8
  });
}

let t = 0;

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, width, height);

  // Draw wave lines
  for (const line of lines) {
    ctx.beginPath();
    ctx.strokeStyle = `rgba(255,255,255,${line.opacity})`;
    ctx.lineWidth = 1;

    for (let x = 0; x <= width; x += 4) {
      const y = line.baseY +
        Math.sin(x / line.wavelength + t * line.speed + line.phase) * line.amplitude;
      if (x === 0) {
        ctx.moveTo(x, y);
      } else {
        ctx.lineTo(x, y);
      }
    }
    ctx.stroke();
  }

  // Draw dots, drifting up and down with their own wave motion
  for (const dot of dots) {
    const y = dot.y +
      Math.sin(dot.x / dot.wavelength + t * dot.speed + dot.phase) * dot.amplitude;

    ctx.beginPath();
    ctx.fillStyle = `rgba(255,255,255,${dot.opacity})`;
    ctx.arc(dot.x, y, dot.radius, 0, Math.PI * 2);
    ctx.fill();
  }

  t += 0.02;
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
